# The repository gate. Same command that runs locally: `bun run check` is
# typecheck + tests + build. The build is in it on purpose — it assembles the
# userscript and can fail on its own.
name: check

on:
  push:
    # The rewrite happens on its own branch, so that is where the gate is needed
    # today. Without this a push there runs nothing at all — `pull_request` only
    # fires once a PR exists.
    branches: [main, "rewrite/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version this repo is developed against. "latest" means
      # the gate turns red one day with no change in the code, and then nobody
      # knows whether it is a regression or a new Bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run check
