# The repository gate. Same command that runs locally: `bun run check` is
# typecheck + tests + build. The build is in it on purpose — it assembles the
# userscript and can fail on its own.
name: check

on:
  # Every branch, not a list. A named list is a claim about how this repository
  # is worked on, and the last one outlived the branch it named by a month —
  # `rewrite/2026-08` had been merged into `main` since 0.5.0 while this file
  # still said that is where the work happens
  # (`docs/audits/2026-08-14-the-whole-tree-read-a-third-time.md`, F25).
  # `pull_request` stays: it is the only thing that runs the gate on a fork.
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version this repo is developed against. "latest" means
      # the gate turns red one day with no change in the code, and then nobody
      # knows whether it is a regression or a new Bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run check
