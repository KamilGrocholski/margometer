# The preview, published. `bun run preview` serves that page from a machine that
# has this repository checked out; this writes it as files and puts them on the
# web, so the panel can be looked at by somebody who has installed nothing — into
# a game that has not authorised the add-on (README.md).
#
# The gate runs first and the deploy is gated on it, for release.yml's reason: a
# tree that cannot pass `bun run check` must not become the page this repository
# points people at.
#
# ⚠️ **Pages has to exist before anything can be deployed to it, and it is
# created once by hand: Settings → Pages → Build and deployment → Source →
# GitHub Actions.** Not "Deploy from a branch" — every page here is generated
# into `dist/`, which git ignores. Three runs say so, and they are written down
# because the sentence above was got wrong three times before them:
#
# 1. Without `enablement`, `configure-pages` fails outright —
#    `Error: Get Pages site failed. ... Not Found - .../pages#get-a-apiname-pages-site`,
#    naming an API route rather than the setting behind it.
# 2. With `enablement: true` the missing site becomes a warning and the create
#    call fails instead — `Error: Create Pages site failed. Error: No server is
#    currently available to service your request.`
# 3. The same step, the same `enablement: true`, on 2026-08-18T00:45Z —
#    `Create Pages site failed. Error: Resource not accessible by integration -
#    .../pages#create-a-apiname-pages-site`, and `has_pages` still false after
#    it.
#
# 1 and 2 were inside an incident covering Pages, open on githubstatus.com from
# 13:40Z to 21:16Z on 2026-08-17, so neither said anything about this repository.
# 3 was 3 h 29 min after that incident resolved, with none open, and it is a
# refusal rather than a service saying it is busy: the token a workflow run is
# given cannot create the site here, on a public repository, with `pages: write`.
# Whether some other repository's run can is not something one run can say — the
# three corrections before this one were each a claim of that size from one
# observation.
#
# `enablement: true` stays, and it is not the switch: once a site exists it does
# nothing, and where none exists it changes only which sentence prints. It is
# kept for the fork whose owner GitHub does let create a site by API.
#
# ⚠️ **What gets published is the captures' own engine payloads**, inlined one
# fight per page. NOTICE.md says what that carries and on what basis. Nothing
# generated here is ever committed: the output goes under `dist/`, which git
# ignores, and a tracked page carrying a capture would fail the gate on its own
# (`tests/tools/source-layout.test.ts` refuses a name the game gave an ability
# outside the recordings).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# What a Pages deployment needs and nothing more. `id-token` is how deploy-pages
# proves to Pages that this run is the one that uploaded the artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a running one is left to finish: cancelling
# mid-deploy leaves the site serving whichever half of the upload arrived.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # One job rather than the two-job template GitHub documents: the build and the
  # deploy share a checkout and a `bun install`, and splitting them buys an
  # artifact hand-off between two steps that would run back to back anyway.
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Same pin as check.yml and release.yml, and for the same reason: "latest"
      # means the published page changes one day with no change in the code.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run check

      - run: bun run preview:site

      # GitHub's own actions, so the only third-party one here is setup-bun,
      # which both other workflows already use at the same pin.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/preview
      - id: deploy
        uses: actions/deploy-pages@v4
