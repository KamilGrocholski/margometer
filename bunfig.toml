[test]
preload = ["./tests/setup.dom.ts"]

# Pokrycie liczone ZAWSZE, nie tylko pod `bun run coverage`.
#
# Powód jest zmierzony, nie teoretyczny. `TOOLING.md` trzymał jako otwarte zdanie
# „brak progu pokrycia — regresja pokrycia przechodzi cicho", a stan bazowy w tym
# samym pliku mówił „650 zielonych, 98,61 % linii". Przy audycie 2026‑08‑02
# wyszło 675 zielonych i 97,34 % — i nikt tego nie zauważył, bo liczbę oglądało
# się tylko wtedy, gdy się o nią osobno poprosiło. Teraz stoi pod każdym
# przebiegiem `bun test`, czyli pod bramą.
#
# Koszt zmierzony na tym zestawie: 7 367 → 8 948 ms, czyli ~1,6 s na przebieg.
coverage = true
coverageSkipTestFiles = true

# PROGU TU NIE MA — i to jest decyzja, nie przeoczenie.
#
# `coverageThreshold` w Bunie 1.3.14 sprawdza się PER PLIK, nie na sumie.
# Zmierzone: przy sumie 97,4 % / 94,2 % brama pada już na progu
# `{ lines = 0.44, functions = 0.43 }`, bo najsłabszym plikiem raportu jest
# `tools/pomoc.ts` (43,52 % / 42,86 % — sam blok CLI). Najwyższy próg, który
# dzisiejsze repo przepuszcza, to więc `0.43` — liczba niepilnująca niczego,
# a wyglądająca jak zabezpieczenie. Fałszywe zabezpieczenie jest tu gorsze niż
# jego brak: to dokładnie ta klasa, którą repo zna jako „testy zielone i puste".
#
# Dwie pułapki zmierzone przy okazji, żeby nikt nie wyprowadzał ich drugi raz:
#   • `{ line = …, function = … }` w liczbie POJEDYNCZEJ przechodzi przez parser
#     bez słowa i jest po cichu IGNOROWANY — przy progu 0,99 zapisanym tak
#     `bun test` kończy się kodem 0. Działa wyłącznie `lines` / `functions`;
#   • `coveragePathIgnorePatterns = ["tools/"]` NIE ZADZIAŁAŁO — próg pada na
#     `tools/pomoc.ts` tak samo z tym kluczem, jak i bez niego.
#
# Próg wejdzie, gdy da się go ustawić sensownie: albo po dociągnięciu trzech
# najsłabszych plików (`src/index.ts` 60,00 % funkcji — trzy `catch`
# i `safeStorage`, `SOLID §10`; `tools/pomoc.ts` i `tools/changelog.ts` — bloki
# CLI), albo gdy próg da się postawić na SUMIE.
